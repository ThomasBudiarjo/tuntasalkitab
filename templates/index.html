{{define "content"}}
<section class="progress-hero" aria-label="Reading progress">
  <div class="progress-ring-wrap">
    <svg class="progress-ring" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="progress-ring-track" cx="60" cy="60" r="52" />
      <circle
        class="progress-ring-fill"
        cx="60"
        cy="60"
        r="52"
        style="stroke-dashoffset: calc(327 - (327 * {{.ProgressPercent}} / 100))"
      />
    </svg>
    <div class="progress-ring-label">
      <span class="progress-percent">{{.ProgressPercent}}%</span>
      <span class="progress-sub">complete</span>
    </div>
  </div>
  <div class="progress-details">
    <h2 class="progress-heading">Your journey</h2>
    <p class="progress-stat">
      <strong>{{.CompletedCount}}</strong> of <strong>365</strong> days read
    </p>
    <div class="progress-bar" role="progressbar" aria-valuenow="{{.ProgressPercent}}" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-fill" style="width: {{.ProgressPercent}}%"></div>
    </div>
    <p class="progress-remaining">{{.RemainingDays}} days remaining</p>
  </div>
</section>

<section class="tracker-card" aria-label="Monthly reading checklist">
  <div class="card-toolbar">
    <div class="month-picker">
      <label class="month-picker-label" for="month-select">Month</label>
      <div class="month-select-wrap">
        <select
          id="month-select"
          name="month"
          class="month-select"
          hx-get="/month"
          hx-target="#month-content"
          hx-swap="innerHTML"
        >
          <option value="1" {{if eq .MonthInfo.Month 1}}selected{{end}}>January</option>
          <option value="2" {{if eq .MonthInfo.Month 2}}selected{{end}}>February</option>
          <option value="3" {{if eq .MonthInfo.Month 3}}selected{{end}}>March</option>
          <option value="4" {{if eq .MonthInfo.Month 4}}selected{{end}}>April</option>
          <option value="5" {{if eq .MonthInfo.Month 5}}selected{{end}}>May</option>
          <option value="6" {{if eq .MonthInfo.Month 6}}selected{{end}}>June</option>
          <option value="7" {{if eq .MonthInfo.Month 7}}selected{{end}}>July</option>
          <option value="8" {{if eq .MonthInfo.Month 8}}selected{{end}}>August</option>
          <option value="9" {{if eq .MonthInfo.Month 9}}selected{{end}}>September</option>
          <option value="10" {{if eq .MonthInfo.Month 10}}selected{{end}}>October</option>
          <option value="11" {{if eq .MonthInfo.Month 11}}selected{{end}}>November</option>
          <option value="12" {{if eq .MonthInfo.Month 12}}selected{{end}}>December</option>
        </select>
      </div>
    </div>

    <div class="mode-toggle" role="group" aria-label="View mode">
      <button
        type="button"
        class="mode-btn is-active"
        id="mode-check-btn"
        onclick="setMode('checklist')"
        aria-pressed="true"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" fill="currentColor"/></svg>
        Check
      </button>
      <button
        type="button"
        class="mode-btn"
        id="mode-link-btn"
        onclick="setMode('link')"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 12c0-1.7 1.3-3.1 2.9-3.1h4V7H6.8C4.6 7 2.8 8.8 2.8 11s1.8 4 4 4h4v-1.9H6.8c-1.6 0-2.9-1.4-2.9-3.1zm5.1 0h8v1.9h-8V12zm7.1 3.1h4c1.6 0 2.9-1.4 2.9-3.1s-1.3-3.1-2.9-3.1h-4V7h4c2.2 0 4 1.8 4 4s-1.8 4-4 4h-4v-1.9z" fill="currentColor"/></svg>
        Link
      </button>
    </div>
  </div>

  <div id="month-content" class="checklist-mode">
    {{template "month_card" .MonthInfo}}
  </div>
</section>

{{if gt .MissedCount 0}}
<details class="missed-card">
  <summary
    class="missed-summary"
    hx-get="/missed"
    hx-trigger="click once"
    hx-target="#missed-content"
    hx-swap="innerHTML"
  >
    <span class="missed-summary-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="currentColor"/></svg>
    </span>
    <span class="missed-summary-text">Missed readings</span>
    <span class="missed-badge">{{.MissedCount}}</span>
    <span class="missed-chevron" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" fill="currentColor"/></svg>
    </span>
  </summary>
  <div id="missed-content" class="missed-content"></div>
</details>
{{end}}

<script>
  function setMode(mode) {
    var content = document.getElementById("month-content");
    var checkBtn = document.getElementById("mode-check-btn");
    var linkBtn = document.getElementById("mode-link-btn");

    if (mode === "link") {
      content.classList.remove("checklist-mode");
      content.classList.add("link-mode");
      checkBtn.classList.remove("is-active");
      linkBtn.classList.add("is-active");
      checkBtn.setAttribute("aria-pressed", "false");
      linkBtn.setAttribute("aria-pressed", "true");
      localStorage.setItem("bibleTrackerMode", "link");
    } else {
      content.classList.remove("link-mode");
      content.classList.add("checklist-mode");
      linkBtn.classList.remove("is-active");
      checkBtn.classList.add("is-active");
      linkBtn.setAttribute("aria-pressed", "false");
      checkBtn.setAttribute("aria-pressed", "true");
      localStorage.setItem("bibleTrackerMode", "checklist");
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    var savedMode = localStorage.getItem("bibleTrackerMode");
    if (savedMode === "link") {
      setMode("link");
    }
  });

  function refreshMonth() {
    var select = document.getElementById("month-select");
    htmx.ajax("GET", "/month?month=" + select.value, {
      target: "#month-content",
      swap: "innerHTML",
    });
  }

  // Browsers without tab support (e.g. Kindle) open passage links in the
  // same tab; navigating back restores stale HTML from before any HTMX
  // toggles. Re-fetch the month view whenever the page is shown via
  // back/forward navigation so completed days stay struck through.
  window.addEventListener("pageshow", function (e) {
    var navEntry =
      performance.getEntriesByType &&
      performance.getEntriesByType("navigation")[0];
    var isBackForward =
      e.persisted ||
      (navEntry && navEntry.type === "back_forward") ||
      (performance.navigation && performance.navigation.type === 2);
    if (isBackForward) refreshMonth();
  });
</script>
{{end}}
